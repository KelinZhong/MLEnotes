name: Deploy Jupyter Book

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Notebook execution across 36 notebooks (incl. PyTorch cells) takes a while;
    # raise the job timeout well above the default 360 min is unnecessary, but
    # 60 min gives comfortable headroom over the ~10-20 min expected build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # cache wheels between runs — big speedup for torch

      - name: Install Jupyter Book
        run: pip install "jupyter-book<2" ghp-import pydata-sphinx-theme

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install IPython kernel
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Build the book
        run: jupyter-book build .

      - name: Deploy to GitHub Pages
        run: |
          ghp-import -n -p -f _build/html
