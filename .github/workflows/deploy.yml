name: Deploy Jupyter Book

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 63 notebooks now execute, including PyTorch/TF training loops and
    # pretrained-weight downloads (resnet18, EfficientNetB0/MobileNetV2/
    # ResNet50/VGG16 imagenet weights in tf8). Raised from 60 to give the
    # merged book comfortable headroom.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # cache wheels between runs — big speedup for torch/tf

      - name: Install Jupyter Book
        run: pip install "jupyter-book<2" ghp-import pydata-sphinx-theme

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install IPython kernel
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Build the book
        run: jupyter-book build .

      - name: Deploy to GitHub Pages
        run: |
          ghp-import -n -p -f _build/html
