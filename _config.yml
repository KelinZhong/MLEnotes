title: Machine Learning Engineer Notes
author: Kelin Zhong
repository:
  url: https://github.com/KelinZhong/MLEnotes

execute:
  execute_notebooks: "force"
  # PyTorch/TensorFlow training loops and the pretrained-model notebooks
  # (which download weights on first run) need far more than the 30s
  # per-cell default.
  timeout: 600
  # If build time ever becomes a problem, the biggest lever is skipping the
  # framework guides (their outputs are already saved in the notebooks):
  # exclude_patterns:
  #   - "PyTorch Guide/*"
  #   - "TensorFlow Guide/*"

html:
  use_repository_button: true
  home_page_in_navbar: true

sphinx:
  config:
    html_theme: pydata_sphinx_theme
    html_theme_options:
      # 1. Rename the "More" button to "Topics"
      header_dropdown_text: "Topics"

      # 2. Force all top-level chapters into the "Topics" dropdown
      header_links_before_dropdown: 0

      # 3. Keep the sidebar behavior from the original book
      primary_sidebar_end: ["page-toc"]
      secondary_sidebar_items: []

      # 4. Sidebar behavior settings
      collapse_navigation: false
      show_nav_level: 2
      navigation_depth: 4

      # 5. Navbar layout
      navbar_center: ["navbar-nav"] # This ensures the "Topics" button appears
      navbar_end: ["theme-switcher", "navbar-icon-links"]
